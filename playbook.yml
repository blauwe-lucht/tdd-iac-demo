---
- name: Install nginx on the demo-vm
  hosts: demo
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Ensure nginx is started and enabled
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Replace the default index page with a neutral one
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <title>Welcome</title>
            </head>
            <body>
              <h1>It works.</h1>
              <p>This site is up and running.</p>
            </body>
          </html>
        owner: root
        group: root
        mode: "0644"
